<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Agriculture Dashboard</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f8f1;
        color: #233;
      }
      .app {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        background: linear-gradient(135deg, #2e7d32, #66bb6a);
        color: white;
        padding: 24px;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }
      th, td {
        padding: 12px;
        border-bottom: 1px solid #e0e0e0;
        text-align: left;
      }
      th {
        background: #f0f6e8;
      }
      .tips {
        margin-top: 20px;
        background: white;
        padding: 16px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const crops = [
        { name: 'Rice', season: 'Kharif', status: 'Growing' },
        { name: 'Wheat', season: 'Rabi', status: 'Ready for Harvest' },
        { name: 'Corn', season: 'Summer', status: 'Planted' }
      ];

      const root = document.getElementById('root');
      root.innerHTML = `
        <div class="app">
          <header>
            <h1>🌾 Smart Agriculture Dashboard</h1>
            <p>Technology for modern farming</p>
          </header>

          <section class="cards">
            <div class="card">
              <h2>🌱 Crops</h2>
              <p>Total Crops: ${crops.length}</p>
            </div>
            <div class="card">
              <h2>🌦 Weather</h2>
              <p>Temperature: 28°C</p>
              <p>Rainfall: 70%</p>
            </div>
            <div class="card">
              <h2>💧 Irrigation</h2>
              <p>Water Level: Normal</p>
            </div>
          </section>

          <section>
            <h2>Crop Details</h2>
            <table>
              <thead>
                <tr>
                  <th>Crop</th>
                  <th>Season</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                ${crops.map(crop => `<tr><td>${crop.name}</td><td>${crop.season}</td><td>${crop.status}</td></tr>`).join('')}
              </tbody>
            </table>
          </section>

          <section class="tips">
            <h2>🌿 Farming Tips</h2>
            <ul>
              <li>Use organic fertilizers for healthy crops.</li>
              <li>Monitor soil moisture regularly.</li>
              <li>Use drip irrigation to save water.</li>
            </ul>
          </section>

          <footer>
            <p>© 2026 Smart Agriculture</p>
          </footer>
        </div>
      `;
    </script>
  </body>
</html>
